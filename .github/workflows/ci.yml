name: ci

# Every pull request, and main after a merge: install from the lockfile,
# lint, typecheck, test, build. Until this existed the crawl was the only
# workflow, and two red tests sat on main unnoticed.
#
# No secret is used here. The build prerenders pages from Postgres, so it gets
# a throwaway database on the runner with db/schema.sql applied and no rows.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:17-alpine, pinned by digest.
        image: postgres@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indiecraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/indiecraft
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/indiecraft
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Same pinned commits as crawl.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # pnpm's npm ci: the lockfile is the install, or the job fails.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Schema
        run: pnpm schema:apply

      - run: pnpm build
